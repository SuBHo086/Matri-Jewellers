<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0" stop-color="#203A63"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4D98C" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F4D98C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9CC4ED"/>
      <stop offset="0.6" stop-color="#4A7DB0"/>
      <stop offset="1" stop-color="#1F4270"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="380" rx="230" ry="210" fill="url(#warm)"/>

  <!-- Bench line -->
  <rect x="60" y="600" width="480" height="6" rx="3" fill="#C9A227" opacity="0.4"/>
  <rect x="60" y="610" width="480" height="2" rx="1" fill="#4A7DB0" opacity="0.4"/>

  <!-- Ornamental filigree arc above bench -->
  <path d="M120 600 C 180 520, 420 520, 480 600" fill="none" stroke="#C9A227" stroke-width="1.5" opacity="0.35"/>

  <!-- Centrepiece: gold bangle with sapphire setting -->
  <g transform="translate(300 410)">
    <circle cx="0" cy="0" r="96" fill="none" stroke="url(#gold)" stroke-width="14"/>
    <circle cx="0" cy="0" r="96" fill="none" stroke="#FBE3A1" stroke-width="3" opacity="0.8"/>
    <!-- engraved groove -->
    <circle cx="0" cy="0" r="104" fill="none" stroke="#8a6d1a" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#8a6d1a" stroke-width="1.5" opacity="0.7"/>
    <!-- filigree dots around -->
    <g fill="#F4D98C" opacity="0.9">
      <circle cx="74" cy="-74" r="3"/>
      <circle cx="96" cy="-40" r="2.5"/>
      <circle cx="98" cy="14" r="3"/>
      <circle cx="70" cy="66" r="2.5"/>
      <circle cx="-74" cy="-74" r="3"/>
      <circle cx="-98" cy="-32" r="2.5"/>
      <circle cx="-90" cy="40" r="3"/>
      <circle cx="-60" cy="78" r="2.5"/>
    </g>
    <!-- sapphire set at base of bangle -->
    <ellipse cx="0" cy="82" rx="16" ry="12" fill="url(#gem)"/>
    <ellipse cx="0" cy="82" rx="16" ry="12" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <ellipse cx="-4" cy="78" rx="4" ry="3" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Left tool: tweezers -->
  <g transform="translate(120 330) rotate(-70 0 0)">
    <rect x="-3" y="-60" width="6" height="120" rx="3" fill="url(#gold)" opacity="0.55"/>
    <rect x="-3" y="-60" width="6" height="28" rx="3" fill="#F4D98C" opacity="0.5"/>
  </g>

  <!-- Right tool: spar stone -->
  <g transform="translate(492 364)">
    <path d="M0 -26 L 11 -8 L 5 10 L -5 10 L -11 -8 Z" fill="url(#gem)" opacity="0.9"/>
    <path d="M0 -26 L 11 -8 L 0 2 Z" fill="#FFFFFF" opacity="0.55"/>
  </g>
  <circle cx="498" cy="398" r="30" fill="none" stroke="#C9A227" stroke-width="1.5" opacity="0.4"/>

  <!-- Sparkle dust -->
  <g fill="#FFFFFF" opacity="0.85">
    <path d="M220 250 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z"/>
    <path d="M430 290 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.6"/>
    <path d="M160 500 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.5"/>
  </g>
  <g fill="#F4D98C" opacity="0.7">
    <circle cx="255" cy="540" r="2"/>
    <circle cx="350" cy="540" r="2.5"/>
    <circle cx="420" cy="520" r="2"/>
  </g>
</svg>