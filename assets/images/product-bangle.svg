<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9CC4ED"/>
      <stop offset="0.6" stop-color="#4A7DB0"/>
      <stop offset="1" stop-color="#1F4270"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="400" rx="200" ry="200" fill="url(#glow)"/>

  <!-- Large gold bangle -->
  <g transform="translate(300 400)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#gold)" stroke-width="26"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#FBE3A1" stroke-width="5" opacity="0.9"/>
    <!-- engraved grooves -->
    <circle cx="0" cy="0" r="164" fill="none" stroke="#8a6d1a" stroke-width="2" opacity="0.75"/>
    <circle cx="0" cy="0" r="136" fill="none" stroke="#8a6d1a" stroke-width="2" opacity="0.75"/>
    <!-- filigree dots ring -->
    <g fill="#F4D98C" opacity="0.9">
      <circle cx="120" cy="-90" r="3.5"/>
      <circle cx="150" cy="-14" r="3.5"/>
      <circle cx="108" cy="104" r="3.5"/>
      <circle cx="0" cy="150" r="3.5"/>
      <circle cx="-108" cy="104" r="3.5"/>
      <circle cx="-150" cy="-14" r="3.5"/>
      <circle cx="-120" cy="-90" r="3.5"/>
    </g>
    <!-- Sapphire stones set around the band -->
    <g>
      <ellipse cx="150" cy="-30" rx="10" ry="8" fill="url(#gem)"/>
      <ellipse cx="150" cy="-30" rx="10" ry="8" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <ellipse cx="-150" cy="-30" rx="10" ry="8" fill="url(#gem)"/>
      <ellipse cx="-150" cy="-30" rx="10" ry="8" fill="none" stroke="url(#gold)" stroke-width="3"/>
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M200 220 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
    <path d="M460 300 l3.5 10 10 3.5 -10 3.5 -3.5 10 -3.5 -10 -10 -3.5 10 -3.5 Z" opacity="0.6"/>
    <path d="M120 480 l3.5 10 10 3.5 -10 3.5 -3.5 10 -3.5 -10 -10 -3.5 10 -3.5 Z" opacity="0.5"/>
  </g>
</svg>