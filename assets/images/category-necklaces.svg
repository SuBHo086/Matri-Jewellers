<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9CC4ED"/>
      <stop offset="0.6" stop-color="#4A7DB0"/>
      <stop offset="1" stop-color="#1F4270"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="380" rx="220" ry="210" fill="url(#glow)"/>

  <!-- Hero necklace: bold gold chain with large sapphire pendant -->
  <g transform="translate(300 380)">
    <!-- draped chain with drop -->
    <path d="M -150 40 C -90 130, 90 130, 150 40" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <g fill="#F4D98C" opacity="0.9">
      <circle cx="-90" cy="86" r="3.5"/>
      <circle cx="-30" cy="106" r="3.5"/>
      <circle cx="30" cy="106" r="3.5"/>
      <circle cx="90" cy="86" r="3.5"/>
    </g>
    <!-- drop chain -->
    <path d="M 0 96 L 0 150" stroke="url(#gold)" stroke-width="5" fill="none"/>
    <!-- octagon sapphire pendant -->
    <path d="M 0 -10 L 56 20 L 56 92 L 0 122 L -56 92 L -56 20 Z" fill="url(#gem)"/>
    <path d="M 0 -10 L 56 20 L 56 92 L 0 122 L -56 92 L -56 20 Z" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <path d="M 0 -10 L 0 122" stroke="#F4D98C" stroke-width="3" opacity="0.8"/>
    <path d="M -24 36 L 0 8 L 24 36 L 0 62 Z" fill="#FFFFFF" opacity="0.7"/>
    <!-- bale -->
    <circle cx="0" cy="-22" r="13" fill="none" stroke="url(#gold)" stroke-width="5"/>
  </g>

  <!-- Side necklace shorter -->
  <g transform="translate(140 250) rotate(-12)">
    <path d="M -80 30 C -50 100, 50 100, 80 30" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="0" cy="78" r="30" fill="url(#gem)"/>
    <circle cx="0" cy="78" r="30" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M 0 52 L 10 78 L 0 102 L -10 78 Z" fill="#FFFFFF" opacity="0.65"/>
  </g>
  <g transform="translate(455 540) rotate(10)">
    <path d="M -80 30 C -50 100, 50 100, 80 30" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="0" cy="78" r="28" fill="url(#gem)"/>
    <circle cx="0" cy="78" r="28" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M 0 54 L 9 78 L 0 100 L -9 78 Z" fill="#FFFFFF" opacity="0.65"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M240 200 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
    <path d="M420 260 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.5"/>
    <path d="M140 500 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.5"/>
  </g>
</svg>