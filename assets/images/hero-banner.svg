<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="0.62" cy="0.5" r="0.85">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.5" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <linearGradient id="goldHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE3A1"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9CC4ED"/>
      <stop offset="0.6" stop-color="#4A7DB0"/>
      <stop offset="1" stop-color="#1F4270"/>
    </radialGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Soft light field behind the piece -->
  <ellipse cx="1080" cy="470" rx="380" ry="330" fill="url(#glow)"/>

  <!-- Subtle texture dots, left and right edges -->
  <g opacity="0.12">
    <g fill="#C9A227">
      <circle cx="120" cy="150" r="2"/>
      <circle cx="180" cy="230" r="1.5"/>
      <circle cx="140" cy="330" r="2"/>
      <circle cx="210" cy="420" r="1.5"/>
      <circle cx="150" cy="520" r="2"/>
      <circle cx="200" cy="610" r="1.5"/>
    </g>
    <g fill="#4A7DB0">
      <circle cx="1480" cy="150" r="2"/>
      <circle cx="1420" cy="230" r="1.5"/>
      <circle cx="1460" cy="330" r="2"/>
      <circle cx="1390" cy="420" r="1.5"/>
    </g>
  </g>

  <!-- Necklace chain drape -->
  <path d="M880 300 C 930 470, 1210 510, 1350 340" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <!-- Chain link highlights -->
  <g fill="#F4D98C" opacity="0.85">
    <circle cx="930" cy="340" r="3"/>
    <circle cx="1000" cy="405" r="3"/>
    <circle cx="1090" cy="462" r="3"/>
    <circle cx="1220" cy="455" r="3"/>
    <circle cx="1290" cy="400" r="3"/>
  </g>

  <!-- Pendant: pear-cut sapphire in gold bezel -->
  <g transform="translate(1080 440)">
    <path d="M0 -8 C 6 4, 8 16, 4 46 C 2 54 -2 54 -4 46 C -8 16, -6 4, 0 -8 Z"
          fill="url(#gem)"/>
    <path d="M0 -8 C 6 4, 8 16, 4 46 C 2 54 -2 54 -4 46 C -8 16, -6 4, 0 -8 Z"
          fill="none" stroke="url(#goldHi)" stroke-width="3"/>
    <path d="M -1.5 2 L 0 -3 L 1.5 2 L 0 44" fill="none" stroke="url(#goldHi)" stroke-width="2.5"/>
    <!-- Crown / tiara -->
    <circle cx="0" cy="-16" r="9" fill="url(#goldHi)"/>
    <circle cx="0" cy="-16" r="5" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="0" cy="-30" r="3.5" fill="url(#gold)"/>
    <circle cx="-13" cy="-22" r="2.5" fill="url(#gold)"/>
    <circle cx="13" cy="-22" r="2.5" fill="url(#gold)"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M1030 250 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 Z" opacity="0.9"/>
    <path d="M1360 230 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.7"/>
    <path d="M1240 560 l3.5 10 10 3.5 -10 3.5 -3.5 10 -3.5 -10 -10 -3.5 10 -3.5 Z" opacity="0.6"/>
    <path d="M900 560 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.55"/>
  </g>
  <!-- Tiny gold dust -->
  <g fill="#F4D98C" opacity="0.75">
    <circle cx="1000" cy="520" r="2"/>
    <circle cx="1165" cy="540" r="2.5"/>
    <circle cx="1230" cy="500" r="1.5"/>
    <circle cx="1120" cy="265" r="2"/>
    <circle cx="1060" cy="300" r="1.5"/>
  </g>
</svg>