<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9CC4ED"/>
      <stop offset="0.6" stop-color="#4A7DB0"/>
      <stop offset="1" stop-color="#1F4270"/>
    </radialGradient>
    <radialGradient id="crimson" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#E86A6A"/>
      <stop offset="0.55" stop-color="#C0392B"/>
      <stop offset="1" stop-color="#7E1F18"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="380" rx="220" ry="210" fill="url(#glow)"/>

  <!-- Hero chandelier earring (left) -->
  <g transform="translate(215 300)">
    <circle cx="0" cy="-30" r="15" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M0 -45 V -12" stroke="url(#gold)" stroke-width="4" fill="none"/>
    <!-- top rock -->
    <circle cx="0" cy="0" r="22" fill="url(#crimson)"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <!-- middle rock -->
    <ellipse cx="0" cy="44" rx="24" ry="16" fill="url(#gem)"/>
    <ellipse cx="0" cy="44" rx="24" ry="16" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
    <!-- connector -->
    <rect x="-3" y="20" width="6" height="10" rx="3" fill="url(#gold)"/>
    <!-- drop -->
    <path d="M0 64 C 13 76, 17 92, 9 128 C 5 140 -5 140 -9 128 C -17 92, -13 76, 0 64 Z" fill="url(#gold)"/>
    <path d="M0 64 C 13 76, 17 92, 9 128 C 5 140 -5 140 -9 128 C -17 92, -13 76, 0 64 Z" fill="none" stroke="#FBE3A1" stroke-width="2.5"/>
    <path d="M0 72 C 4 84, 6 108, 3 124" fill="none" stroke="#F4D98C" stroke-width="3" opacity="0.9"/>
    <circle cx="0" cy="66" r="6" fill="url(#gem)"/>
  </g>

  <!-- Right pair (mirror) -->
  <g transform="translate(385 300)">
    <circle cx="0" cy="-30" r="15" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M0 -45 V -12" stroke="url(#gold)" stroke-width="4" fill="none"/>
    <circle cx="0" cy="0" r="22" fill="url(#crimson)"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <ellipse cx="0" cy="44" rx="24" ry="16" fill="url(#gem)"/>
    <ellipse cx="0" cy="44" rx="24" ry="16" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
    <rect x="-3" y="20" width="6" height="10" rx="3" fill="url(#gold)"/>
    <path d="M0 64 C 13 76, 17 92, 9 128 C 5 140 -5 140 -9 128 C -17 92, -13 76, 0 64 Z" fill="url(#gold)"/>
    <path d="M0 64 C 13 76, 17 92, 9 128 C 5 140 -5 140 -9 128 C -17 92, -13 76, 0 64 Z" fill="none" stroke="#FBE3A1" stroke-width="2.5"/>
    <path d="M0 72 C 4 84, 6 108, 3 124" fill="none" stroke="#F4D98C" stroke-width="3" opacity="0.9"/>
    <circle cx="0" cy="66" r="6" fill="url(#gem)"/>
  </g>

  <!-- Small stud accent bottom -->
  <circle cx="300" cy="586" r="34" fill="url(#gem)"/>
  <circle cx="300" cy="586" r="34" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <ellipse cx="-9" cy="-11" rx="8" ry="5" fill="#FFFFFF" opacity="0.7"/>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M180 200 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
    <path d="M420 200 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
  </g>
</svg>