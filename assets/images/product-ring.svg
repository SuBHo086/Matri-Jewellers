<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <radialGradient id="crimson" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#E86A6A"/>
      <stop offset="0.55" stop-color="#C0392B"/>
      <stop offset="1" stop-color="#7E1F18"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="390" rx="190" ry="190" fill="url(#glow)"/>

  <!-- Ring band -->
  <g transform="translate(300 400)">
    <ellipse cx="0" cy="0" rx="130" ry="120" fill="none" stroke="url(#gold)" stroke-width="22"/>
    <ellipse cx="0" cy="4" rx="130" ry="120" fill="none" stroke="#FBE3A1" stroke-width="5" opacity="0.85"/>
    <ellipse cx="0" cy="-38" rx="150" ry="52" fill="none" stroke="url(#gold)" stroke-width="20"/>
    <ellipse cx="0" cy="-42" rx="150" ry="52" fill="none" stroke="#FBE3A1" stroke-width="4" opacity="0.85"/>
  </g>

  <!-- Kunandan gold-crowned oval stone -->
  <g transform="translate(300 300)">
    <ellipse cx="0" cy="0" rx="52" ry="40" fill="url(#crimson)"/>
    <ellipse cx="0" cy="0" rx="52" ry="40" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <ellipse cx="-14" cy="-12" rx="14" ry="10" fill="#FFFFFF" opacity="0.85"/>
    <!-- Kundan dot frame -->
    <g fill="#F4D98C">
      <circle cx="-46" cy="-14" r="3"/>
      <circle cx="-30" cy="-34" r="3"/>
      <circle cx="0" cy="-39" r="3"/>
      <circle cx="30" cy="-34" r="3"/>
      <circle cx="46" cy="-14" r="3"/>
      <circle cx="40" cy="12" r="3"/>
      <circle cx="20" cy="30" r="3"/>
      <circle cx="-20" cy="30" r="3"/>
      <circle cx="-40" cy="12" r="3"/>
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M215 200 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
    <path d="M430 260 l3.5 10 10 3.5 -10 3.5 -3.5 10 -3.5 -10 -10 -3.5 10 -3.5 Z" opacity="0.6"/>
  </g>
</svg>