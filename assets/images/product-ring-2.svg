<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.5" stop-color="#16294A"/>
      <stop offset="1" stop-color="#0E1626"/>
    </linearGradient>
    <radialGradient id="diamond" cx="0.38" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#DDE9F7"/>
      <stop offset="1" stop-color="#A9C2DE"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="400" rx="200" ry="200" fill="url(#glow)"/>

  <!-- Open navy velvet ring box -->
  <path d="M120 330 C 130 286, 200 250, 300 250 C 400 250, 470 286, 480 330 L 480 600 C 470 660, 365 690, 300 690 C 235 690, 130 660, 120 600 Z" fill="url(#velvet)"/>
  <path d="M120 330 C 130 286, 200 250, 300 250 C 400 250, 470 286, 480 330" fill="none" stroke="#2A5B8C" stroke-width="2" opacity="0.7"/>
  <!-- box lid shadow -->
  <path d="M110 300 C 130 250, 200 210, 300 210 C 400 210, 470 250, 490 300 C 470 260, 400 222, 300 222 C 200 222, 130 260, 110 300 Z" fill="#0B1120" opacity="0.55"/>
  <!-- velvet finger groove -->
  <rect x="240" y="545" width="120" height="18" rx="9" fill="#0E1626" opacity="0.6"/>
  <rect x="300" y="330" width="120" height="18" rx="9" fill="#0E1626" opacity="0.6"/>

  <!-- Solitaire ring -->
  <g transform="translate(300 430)">
    <!-- band -->
    <ellipse cx="0" cy="18" rx="96" ry="76" fill="none" stroke="url(#gold)" stroke-width="16"/>
    <ellipse cx="0" cy="20" rx="96" ry="76" fill="none" stroke="#FBE3A1" stroke-width="3.5" opacity="0.85"/>
    <!-- shoulders -->
    <path d="M -92 14 L -40 -40" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 92 14 L 40 -40" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- diamond crown -->
    <path d="M -34 -50 L -24 -72 L 0 -84 L 24 -72 L 34 -50 L 26 -38 L -26 -38 Z" fill="url(#diamond)"/>
    <path d="M -34 -50 L 0 -84 L 0 -38 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M -24 -72 L 0 -38 L 24 -72 Z" fill="#D5E4F5" opacity="0.6"/>
    <!-- pavilion lines -->
    <path d="M 0 -38 L -12 -14 L 0 -24 Z" fill="#A9C2DE" opacity="0.7"/>
    <path d="M 0 -38 L 12 -14 L 0 -24 Z" fill="#C7DAEF" opacity="0.7"/>
    <!-- prong base -->
    <circle cx="0" cy="-84" r="5" fill="url(#gold)"/>
    <!-- table sparkle -->
    <path d="M -6 -64 l 3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M200 180 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.9"/>
    <path d="M420 200 l3.5 10 10 3.5 -10 3.5 -3.5 10 -3.5 -10 -10 -3.5 10 -3.5 Z" opacity="0.6"/>
  </g>
</svg>