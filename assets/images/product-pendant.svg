<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <linearGradient id="goldHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE3A1"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9CC4ED"/>
      <stop offset="0.6" stop-color="#4A7DB0"/>
      <stop offset="1" stop-color="#1F4270"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="400" rx="200" ry="200" fill="url(#glow)"/>

  <!-- Chain -->
  <path d="M210 320 C 240 420, 360 420, 420 320" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <g fill="#F4D98C" opacity="0.85">
    <circle cx="250" cy="370" r="2.5"/>
    <circle cx="300" cy="390" r="2.5"/>
    <circle cx="360" cy="372" r="2.5"/>
  </g>

  <!-- Teardrop sapphire pendant -->
  <g transform="translate(300 410)">
    <path d="M0 -20 C 34 6, 38 44, 20 110 C 10 130 -10 130 -20 110 C -38 44, -34 6, 0 -20 Z" fill="url(#gem)"/>
    <path d="M0 -20 C 34 6, 38 44, 20 110 C 10 130 -10 130 -20 110 C -38 44, -34 6, 0 -20 Z" fill="none" stroke="url(#goldHi)" stroke-width="5"/>
    <path d="M -5 4 L 0 -12 L 5 4 L 0 116" fill="none" stroke="url(#goldHi)" stroke-width="4"/>
    <!-- bale -->
    <circle cx="0" cy="-32" r="12" fill="none" stroke="url(#gold)" stroke-width="5"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M180 260 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
    <path d="M450 280 l3.5 10 10 3.5 -10 3.5 -3.5 10 -3.5 -10 -10 -3.5 10 -3.5 Z" opacity="0.6"/>
    <path d="M140 540 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.5"/>
  </g>
</svg>