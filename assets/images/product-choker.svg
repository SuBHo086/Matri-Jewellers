<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9CC4ED"/>
      <stop offset="0.6" stop-color="#4A7DB0"/>
      <stop offset="1" stop-color="#1F4270"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="400" rx="200" ry="200" fill="url(#glow)"/>

  <!-- Collar choker: arc of gold with graduated sapphires + medallion -->
  <g transform="translate(300 400)">
    <!-- collar arc -->
    <path d="M -170 60 A 190 190 0 0 1 170 60" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
    <path d="M -170 60 A 190 190 0 0 1 170 60" fill="none" stroke="#FBE3A1" stroke-width="3.5" opacity="0.85"/>
    <!-- graduated sapphires -->
    <g>
      <circle cx="-150" cy="48" r="9" fill="url(#gem)"/>
      <circle cx="-150" cy="48" r="9" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <circle cx="-102" cy="14" r="12" fill="url(#gem)"/>
      <circle cx="-102" cy="14" r="12" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
      <circle cx="-50" cy="-8" r="15" fill="url(#gem)"/>
      <circle cx="-50" cy="-8" r="15" fill="none" stroke="url(#gold)" stroke-width="4"/>
      <circle cx="50" cy="-8" r="15" fill="url(#gem)"/>
      <circle cx="50" cy="-8" r="15" fill="none" stroke="url(#gold)" stroke-width="4"/>
      <circle cx="102" cy="14" r="12" fill="url(#gem)"/>
      <circle cx="102" cy="14" r="12" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
      <circle cx="150" cy="48" r="9" fill="url(#gem)"/>
      <circle cx="150" cy="48" r="9" fill="none" stroke="url(#gold)" stroke-width="3"/>
    </g>
    <!-- tiny gold links between stones -->
    <g fill="#F4D98C" opacity="0.9">
      <circle cx="-126" cy="30" r="2.5"/>
      <circle cx="-76" cy="3" r="2.5"/>
      <circle cx="0" cy="-20" r="2.5"/>
      <circle cx="76" cy="3" r="2.5"/>
      <circle cx="126" cy="30" r="2.5"/>
    </g>
    <!-- central medallion drop -->
    <path d="M0 26 L 0 120" stroke="url(#gold)" stroke-width="5" fill="none"/>
    <circle cx="0" cy="128" r="38" fill="url(#gem)"/>
    <circle cx="0" cy="128" r="38" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <path d="M 0 96 L 8 110 L 0 128 L -8 110 Z" fill="#FFFFFF" opacity="0.75"/>
    <!-- clasp near right end -->
    <rect x="182" y="40" width="26" height="14" rx="7" fill="url(#gold)"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M180 500 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
    <path d="M420 520 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.6"/>
  </g>
</svg>