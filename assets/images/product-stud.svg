<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9CC4ED"/>
      <stop offset="0.6" stop-color="#4A7DB0"/>
      <stop offset="1" stop-color="#1F4270"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="400" rx="200" ry="200" fill="url(#glow)"/>

  <!-- Pair of sapphire studs, tilted for product feel -->
  <!-- Left stud -->
  <g transform="translate(215 400) rotate(-12)">
    <ellipse cx="0" cy="0" rx="70" ry="48" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <ellipse cx="0" cy="0" rx="70" ry="48" fill="none" stroke="#FBE3A1" stroke-width="3" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="52" ry="34" fill="url(#gem)"/>
    <ellipse cx="0" cy="0" rx="52" ry="34" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <ellipse cx="-16" cy="-10" rx="15" ry="9" fill="#FFFFFF" opacity="0.85"/>
    <!-- back post -->
    <circle cx="0" cy="-38" r="6" fill="#C9A227"/>
  </g>

  <!-- Right stud -->
  <g transform="translate(385 380) rotate(10)">
    <ellipse cx="0" cy="0" rx="70" ry="48" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <ellipse cx="0" cy="0" rx="70" ry="48" fill="none" stroke="#FBE3A1" stroke-width="3" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="52" ry="34" fill="url(#gem)"/>
    <ellipse cx="0" cy="0" rx="52" ry="34" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <ellipse cx="-16" cy="-10" rx="15" ry="9" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="0" cy="-34" r="6" fill="#C9A227"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M150 260 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
    <path d="M460 260 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
    <path d="M300 240 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.6"/>
  </g>
</svg>