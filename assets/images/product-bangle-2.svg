<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9CC4ED"/>
      <stop offset="0.6" stop-color="#4A7DB0"/>
      <stop offset="1" stop-color="#1F4270"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="400" rx="200" ry="200" fill="url(#glow)"/>

  <!-- Twin twisted bangles -->
  <g transform="translate(300 400)">
    <!-- rear bangle -->
    <circle cx="0" cy="-18" r="150" fill="none" stroke="url(#gold)" stroke-width="22"/>
    <circle cx="0" cy="-18" r="150" fill="none" stroke="#FBE3A1" stroke-width="4" opacity="0.8"/>
    <!-- twist lines on rear -->
    <path d="M 40 -160 A 150 150 0 0 1 160 -40" fill="none" stroke="#8a6d1a" stroke-width="2" opacity="0.6"/>
    <path d="M -40 -160 A 150 150 0 0 1 -160 -40" fill="none" stroke="#8a6d1a" stroke-width="2" opacity="0.6"/>
    <!-- front bangle -->
    <circle cx="0" cy="12" r="150" fill="none" stroke="url(#gold)" stroke-width="24"/>
    <circle cx="0" cy="12" r="150" fill="none" stroke="#FBE3A1" stroke-width="5" opacity="0.9"/>
    <!-- twist grooves on front -->
    <path d="M 40 -162 A 150 150 0 0 0 162 -40" fill="none" stroke="#8a6d1a" stroke-width="2.5" opacity="0.7"/>
    <path d="M -40 -162 A 150 150 0 0 0 -162 -40" fill="none" stroke="#8a6d1a" stroke-width="2.5" opacity="0.7"/>
    <path d="M -160 40 A 150 150 0 0 0 -40 162" fill="none" stroke="#8a6d1a" stroke-width="2.5" opacity="0.7"/>
    <path d="M 160 40 A 150 150 0 0 0 40 162" fill="none" stroke="#8a6d1a" stroke-width="2.5" opacity="0.7"/>
    <!-- sapphire accents on front -->
    <circle cx="0" cy="162" r="9" fill="url(#gem)"/>
    <circle cx="0" cy="162" r="9" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="140" cy="-84" r="8" fill="url(#gem)"/>
    <circle cx="140" cy="-84" r="8" fill="none" stroke="url(#gold)" stroke-width="3"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M200 200 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
    <path d="M440 260 l3.5 10 10 3.5 -10 3.5 -3.5 10 -3.5 -10 -10 -3.5 10 -3.5 Z" opacity="0.6"/>
    <path d="M120 500 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.5"/>
  </g>
</svg>