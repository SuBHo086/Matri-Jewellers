<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9CC4ED"/>
      <stop offset="0.6" stop-color="#4A7DB0"/>
      <stop offset="1" stop-color="#1F4270"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="400" rx="200" ry="200" fill="url(#glow)"/>

  <!-- Earrings - pair of gold drops with sapphire teardrops -->
  <!-- Left -->
  <g transform="translate(210 350)">
    <!-- hook -->
    <circle cx="0" cy="-40" r="14" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M0 -54 V -20" stroke="url(#gold)" stroke-width="4" fill="none"/>
    <!-- drop -->
    <path d="M0 -16 C 14 -4, 18 12, 10 52 C 6 64 -6 64 -10 52 C -18 12, -14 -4, 0 -16 Z" fill="url(#gold)"/>
    <path d="M0 -16 C 14 -4, 18 12, 10 52 C 6 64 -6 64 -10 52 C -18 12, -14 -4, 0 -16 Z" fill="none" stroke="#FBE3A1" stroke-width="2.5"/>
    <path d="M0 -8 C 6 0, 8 18, 5 48" fill="none" stroke="#F4D98C" stroke-width="3" opacity="0.9"/>
    <!-- sapphire button -->
    <circle cx="0" cy="-14" r="9" fill="url(#gem)"/>
    <circle cx="0" cy="-14" r="9" fill="none" stroke="url(#gold)" stroke-width="3"/>
  </g>

  <!-- Right (mirror) -->
  <g transform="translate(390 350)">
    <circle cx="0" cy="-40" r="14" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M0 -54 V -20" stroke="url(#gold)" stroke-width="4" fill="none"/>
    <path d="M0 -16 C 14 -4, 18 12, 10 52 C 6 64 -6 64 -10 52 C -18 12, -14 -4, 0 -16 Z" fill="url(#gold)"/>
    <path d="M0 -16 C 14 -4, 18 12, 10 52 C 6 64 -6 64 -10 52 C -18 12, -14 -4, 0 -16 Z" fill="none" stroke="#FBE3A1" stroke-width="2.5"/>
    <path d="M0 -8 C 6 0, 8 18, 5 48" fill="none" stroke="#F4D98C" stroke-width="3" opacity="0.9"/>
    <circle cx="0" cy="-14" r="9" fill="url(#gem)"/>
    <circle cx="0" cy="-14" r="9" fill="none" stroke="url(#gold)" stroke-width="3"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M180 240 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
    <path d="M440 240 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
  </g>
</svg>