<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9CC4ED"/>
      <stop offset="0.6" stop-color="#4A7DB0"/>
      <stop offset="1" stop-color="#1F4270"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="380" rx="220" ry="210" fill="url(#glow)"/>

  <!-- Stacked gold bangles -->
  <g transform="translate(300 400)">
    <!-- back bangle -->
    <circle cx="0" cy="-20" r="150" fill="none" stroke="url(#gold)" stroke-width="22"/>
    <circle cx="0" cy="-20" r="150" fill="none" stroke="#FBE3A1" stroke-width="4" opacity="0.8"/>
    <!-- middle bangle -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#gold)" stroke-width="24"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#FBE3A1" stroke-width="5" opacity="0.9"/>
    <!-- sapphires on middle -->
    <circle cx="0" cy="150" r="12" fill="url(#gem)"/>
    <circle cx="0" cy="150" r="12" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
    <circle cx="-130" cy="-74" r="10" fill="url(#gem)"/>
    <circle cx="-130" cy="-74" r="10" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
    <circle cx="130" cy="-74" r="10" fill="url(#gem)"/>
    <circle cx="130" cy="-74" r="10" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
    <!-- front bangle -->
    <circle cx="0" cy="18" r="150" fill="none" stroke="url(#gold)" stroke-width="20"/>
    <circle cx="0" cy="18" r="150" fill="none" stroke="#FBE3A1" stroke-width="3.5" opacity="0.85"/>
    <!-- engraved spiral hint on front -->
    <path d="M -70 -130 A 150 150 0 0 1 70 -130" fill="none" stroke="#8a6d1a" stroke-width="2" opacity="0.55"/>
    <path d="M 130 -74 A 150 150 0 0 1 150 0" fill="none" stroke="#8a6d1a" stroke-width="2" opacity="0.55"/>
    <!-- gold ball accents -->
    <g fill="#F4D98C" opacity="0.95">
      <circle cx="-96" cy="116" r="6"/>
      <circle cx="96" cy="116" r="6"/>
    </g>
  </g>

  <!-- Side small bangle -->
  <circle cx="120" cy="230" r="58" fill="none" stroke="url(#gold)" stroke-width="12" opacity="0.95"/>
  <circle cx="120" cy="230" r="58" fill="none" stroke="#FBE3A1" stroke-width="3" opacity="0.8"/>
  <circle cx="120" cy="288" r="8" fill="url(#gem)"/>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M220 180 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
    <path d="M450 240 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.5"/>
    <path d="M430 560 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.55"/>
  </g>
</svg>