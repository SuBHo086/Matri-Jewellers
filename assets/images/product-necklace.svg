<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <linearGradient id="goldHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE3A1"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9CC4ED"/>
      <stop offset="0.6" stop-color="#4A7DB0"/>
      <stop offset="1" stop-color="#1F4270"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="400" rx="200" ry="200" fill="url(#glow)"/>

  <!-- Chain drape -->
  <path d="M150 320 C 180 430, 300 480, 420 320" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <g fill="#F4D98C" opacity="0.85">
    <circle cx="200" cy="370" r="3"/>
    <circle cx="250" cy="425" r="3"/>
    <circle cx="350" cy="425" r="3"/>
    <circle cx="400" cy="370" r="3"/>
  </g>

  <!-- Pear sapphire pendant -->
  <g transform="translate(300 470)">
    <path d="M0 -6 C 9 8, 12 26, 6 74 C 3 86 -3 86 -6 74 C -12 26, -9 8, 0 -6 Z" fill="url(#gem)"/>
    <path d="M0 -6 C 9 8, 12 26, 6 74 C 3 86 -3 86 -6 74 C -12 26, -9 8, 0 -6 Z" fill="none" stroke="url(#goldHi)" stroke-width="3.5"/>
    <path d="M -2.5 4 L 0 -4 L 2.5 4 L 0 70" fill="none" stroke="url(#goldHi)" stroke-width="3"/>
    <circle cx="0" cy="-18" r="10" fill="url(#goldHi)"/>
    <circle cx="0" cy="-18" r="5" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M250 220 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.9"/>
    <path d="M420 250 l3.5 10 10 3.5 -10 3.5 -3.5 10 -3.5 -10 -10 -3.5 10 -3.5 Z" opacity="0.6"/>
    <path d="M150 560 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.5"/>
  </g>
</svg>