<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0" stop-color="#1E3B66"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8C46B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E8C46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D98C"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8a6d1a"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#9CC4ED"/>
      <stop offset="0.6" stop-color="#4A7DB0"/>
      <stop offset="1" stop-color="#1F4270"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="385" rx="220" ry="210" fill="url(#glow)"/>

  <!-- Hero ring raised, sapphire solitaire -->
  <g transform="translate(300 400)">
    <!-- band -->
    <ellipse cx="0" cy="30" rx="110" ry="88" fill="none" stroke="url(#gold)" stroke-width="20"/>
    <ellipse cx="0" cy="32" rx="110" ry="88" fill="none" stroke="#FBE3A1" stroke-width="4" opacity="0.85"/>
    <!-- shoulders to crown -->
    <path d="M -100 16 L -36 -34" stroke="url(#gold)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M 100 16 L 36 -34" stroke="url(#gold)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <!-- crown base -->
    <ellipse cx="0" cy="-34" rx="38" ry="16" fill="url(#gold)"/>
    <!-- sapphire solitaire -->
    <path d="M -34 -40 L 0 -72 L 34 -40 Z" fill="url(#gem)"/>
    <path d="M -34 -40 L 0 -72 L 0 -40 Z" fill="#B9D6F2" opacity="0.85"/>
    <path d="M 0 -72 L 34 -40 L 0 -40 Z" fill="#2A5B8C" opacity="0.8"/>
    <path d="M -34 -40 L 34 -40 L 0 -26 Z" fill="#96BADD"/>
    <!-- sparkle cross -->
    <path d="M -4 -62 l 2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- side knots -->
    <circle cx="-96" cy="30" r="7" fill="url(#gold)"/>
    <circle cx="96" cy="30" r="7" fill="url(#gold)"/>
  </g>

  <!-- Decorative side rings -->
  <g transform="translate(150 520) rotate(-14)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="url(#gold)" stroke-width="11"/>
    <circle cx="0" cy="0" r="26" fill="url(#gem)"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
  </g>
  <g transform="translate(452 516) rotate(12)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="url(#gold)" stroke-width="11"/>
    <circle cx="0" cy="0" r="26" fill="url(#gem)"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
  </g>
  <g transform="translate(455 240) rotate(-16)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#gold)" stroke-width="10"/>
    <circle cx="0" cy="0" r="20" fill="url(#gem)"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF">
    <path d="M240 210 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.85"/>
    <path d="M150 350 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.5"/>
    <path d="M450 410 l3 8.5 8.5 3 -8.5 3 -3 8.5 -3 -8.5 -8.5 -3 8.5 -3 Z" opacity="0.55"/>
  </g>
</svg>